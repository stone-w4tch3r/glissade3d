name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      spacedock_tag:
        description: 'Mirror an existing GitHub release to SpaceDock; leave empty for build only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.spacedock_tag == ''
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build, test, and check package
        shell: powershell
        run: ./ci.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Glissade3D
          path: |
            dist/Glissade3D-*.zip
            dist/RELEASE_NOTES.md
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Glissade3D
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.zip
          --verify-tag --title "Glissade3D $RELEASE_TAG"
          --notes-file dist/RELEASE_NOTES.md

  spacedock:
    needs: release
    if: always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.spacedock_tag != ''))
    runs-on: windows-2022
    concurrency:
      group: spacedock-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Mirror published GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.spacedock_tag || github.ref_name }}
          SPACEDOCK_MOD_ID: ${{ vars.SPACEDOCK_MOD_ID }}
          SPACEDOCK_USERNAME: ${{ secrets.SPACEDOCK_USERNAME }}
          SPACEDOCK_PASSWORD: ${{ secrets.SPACEDOCK_PASSWORD }}
        run: ./publish-spacedock.ps1 -Tag $env:RELEASE_TAG
